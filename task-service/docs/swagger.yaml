          schema:
            $ref: '#/definitions/github_com_Akimpupupuu_ClearYourCity_task-service_internal_core_transport_http_response.ErrorResponse'
      security:
      - Auth: []
      summary: Get tasks
      tags:
      - task
    post:
      consumes:
      - application/json
      description: Create new task in our system
      parameters:
      - description: CreateTask request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_feature_tasks_transport_http.CreateTaskRequest'
