    get:
      description: Get all user's tasks with optional pagination
      parameters:
      - description: Size of page with tasks
        in: query
        name: limit
        type: integer
      - description: Offset of page with tasks
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Succesfully got list of tasks
          schema:
