          schema:
            $ref: '#/definitions/github_com_Akimpupupuu_ClearYourCity_task-service_internal_core_transport_http_response.ErrorResponse'
      security:
      - Auth: []
      summary: Create task
      tags:
      - task
  /task/{id}:
    patch:
      consumes:
      - application/json
      description: Patch task in our system
      parameters:
      - description: PatchTask request body
        in: body
